services:
  - type: web
    name: dex-volume-bot
    runtime: node
    plan: standard_paid                  # ✅ Upgraded to paid plan (no cold starts)
    buildCommand: npm install --production
    startCommand: node bot.js
    healthCheckPath: /health            # ✅ Custom health check endpoint

    envVars:
      - key: NODE_ENV
        value: production

      # ── Secrets: set these in the Render dashboard (Environment tab) ──
      - key: BOT_TOKEN
        sync: false                     # paste your Telegram bot token

      - key: ADMIN_USERNAME
        sync: false                     # your Telegram username without @

      - key: BITQUERY_API_KEY
        sync: false                     # your Bitquery API key

      # ── Auto-set by Render – used for the keep-alive self-ping ──
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: dex-volume-bot
          property: host

      # ── Points bot_data.json to the persistent disk so data survives restarts ──
      - key: DATA_PATH
        value: /data/bot_data.json

    # ── Persistent disk — survives restarts, deploys, and crashes ──
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1

    # ── Performance optimizations ──
    memoryMB: 512                       # ✅ Allocate more memory (default is 128)
    maxDrawableDuration: 3600           # ✅ Increase timeout to 1 hour
